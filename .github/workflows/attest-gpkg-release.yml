name: Attest published GPKG release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    if: startsWith(github.event.release.tag_name, 'gpkg-v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download every immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts
          test -f artifacts/SHA256SUMS.txt
          (
            cd artifacts
            sha256sum --check SHA256SUMS.txt
          )

      - name: Generate signed Sigstore build provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: artifacts/*
